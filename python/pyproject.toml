[project]
name = "chatnec"
version = "0.1.0"
description = "Universal chat connector: plug any agent framework into Slack, Telegram, Teams (and more) through one normalized message interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
teams = ["pyjwt>=2.8", "cryptography>=42"]
discord = ["discord.py>=2.3"]
redis = ["redis>=5.0"]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.30"]
autogen = ["pyautogen>=0.2"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["chatnec[teams,discord,redis]"]

[project.scripts]
chatnec = "chatnec.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chatnec*"]

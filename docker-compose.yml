# Runs the connector standalone (HTTP agent mode) plus Redis for durable
# per-conversation session state. Point AGENT_WEBHOOK_URL (in python/.env) at
# your own agent service — add it here as another service once you have one.
services:
  connector:
    build: ./python
    ports:
      - "8000:8000"
    env_file:
      - ./python/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
